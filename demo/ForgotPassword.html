<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Forgot Password — Agent Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/agent_login.css" rel="stylesheet" />
</head>
<body>

    <!-- LEFT PANEL -->


    <!-- RIGHT PANEL -->
    <div class="right">
        <div class="form-box">

            <!-- Steps indicator -->
            <!--<div class="steps">
                <div class="step active" id="s1">
                    <div class="step-dot">1</div>
                    <div class="step-lbl">User ID</div>
                </div>
                <div class="step" id="s2">
                    <div class="step-dot">2</div>
                    <div class="step-lbl">OTP</div>
                </div>
                <div class="step" id="s3">
                    <div class="step-dot">3</div>
                    <div class="step-lbl">New Password</div>
                </div>
            </div>-->

            <!-- Error message -->
            <div class="err-msg" id="errMsg">Invalid User ID. Please check and try again.</div>

            <!-- PANEL 1: Enter User ID -->
            <div class="step-panel active" id="panel1">
                <div class="fh">
                    <h2>Forgot Password?</h2>
                    <p>Enter your Agent User ID. We'll send an OTP to your registered email address.</p>
                </div>
                <div class="fg">
                    <label class="fl">Agent User ID</label>
                    <div class="iw">
                        <span class="iic">👤</span>
                        <input class="inp" id="txtUserId" placeholder="Enter your User ID" autocomplete="off">
                    </div>
                </div>
                <div class="fg">
                    <label class="fl">Email ID</label>
                    <div class="iw">
                        <span class="iic">👤</span>
                        <input class="inp" id="txtUserId" placeholder="Enter your Email ID" autocomplete="off">
                    </div>
                </div>
                <button class="btn-login" onclick="sendOTP()">Send OTP to Email</button>
                <div class="back-lnk"><a href="agent_login.aspx">← Back to Sign In</a></div>
            </div>
        </div>
    </div>

<script>
    var currentPanel = 1;
    var timerInterval;
    var maskedEmail = '';

    // ── Panel navigation ──
    function goPanel(n) {
        document.getElementById('panel' + currentPanel).classList.remove('active');
        document.getElementById('s' + currentPanel).classList.remove('active');
        if (n > 1) document.getElementById('s' + (n-1)).classList.add('done');

        currentPanel = n;
        document.getElementById('panel' + n).classList.add('active');
        if (n <= 3) document.getElementById('s' + n).classList.add('active');
        document.getElementById('errMsg').classList.remove('show');
    }

    // ── STEP 1: Send OTP ──
    function sendOTP() {
        var uid = document.getElementById('txtUserId').value.trim();
        if (!uid) { showErr('Please enter your User ID.'); return; }

        // TODO: Call server API — POST ForgotPassword.aspx/SendOTP { userId: uid }
        // On success: maskedEmail = res.maskedEmail
        maskedEmail = 'a***@gmail.com'; // demo
        document.getElementById('otpSubText').innerText =
            'A 6-digit OTP has been sent to ' + maskedEmail;
        goPanel(2);
        startTimer(120);
    }

    // ── STEP 2: Verify OTP ──
    function verifyOTP() {
        var otp = ['o1','o2','o3','o4','o5','o6'].map(function(id){
            return document.getElementById(id).value;
        }).join('');

        if (otp.length < 6) { showErr('Please enter the complete 6-digit OTP.'); return; }

        // TODO: Call server API — POST ForgotPassword.aspx/VerifyOTP { otp: otp }
        clearInterval(timerInterval);
        goPanel(3);
    }

    // ── STEP 3: Reset Password ──
    function resetPassword() {
        var np = document.getElementById('txtNewPwd').value;
        var cp = document.getElementById('txtConfPwd').value;

        if (np.length < 6) { showErr('Password must be at least 6 characters.'); return; }
        if (np !== cp) { showErr('Passwords do not match.'); return; }

        // TODO: Call server API — POST ForgotPassword.aspx/ResetPassword { newPwd: np }
        document.getElementById('s3').classList.add('done');
        goPanel(4);
    }

    // ── OTP input auto-move ──
    function otpMove(el, prev, next) {
        el.classList.toggle('filled', el.value !== '');
        if (el.value && next) document.getElementById(next).focus();
    }

    function otpBack(e, el, prev) {
        if (e.key === 'Backspace' && !el.value && prev)
            document.getElementById(prev).focus();
    }

    // ── Resend OTP ──
    function resendOTP() {
        ['o1','o2','o3','o4','o5','o6'].forEach(function(id){
            var el = document.getElementById(id);
            el.value = ''; el.classList.remove('filled');
        });
        document.getElementById('o1').focus();
        startTimer(120);
    }

    // ── Timer ──
    function startTimer(sec) {
        clearInterval(timerInterval);
        document.getElementById('timerText').style.display = 'inline';
        document.getElementById('resendText').style.display = 'none';

        timerInterval = setInterval(function() {
            var m = Math.floor(sec / 60);
            var s = sec % 60;
            document.getElementById('timer').innerText = m + ':' + (s < 10 ? '0' : '') + s;
            if (sec <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timerText').style.display = 'none';
                document.getElementById('resendText').style.display = 'inline';
            }
            sec--;
        }, 1000);
    }

    // ── Password strength ──
    function checkStrength(val) {
        var score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;

        var fill = document.getElementById('strengthFill');
        var lbl  = document.getElementById('strengthLabel');
        var levels = [
            { w:'25%', bg:'#EF4444', txt:'Weak',      col:'#EF4444' },
            { w:'50%', bg:'#F97316', txt:'Fair',      col:'#F97316' },
            { w:'75%', bg:'#F5A623', txt:'Good',      col:'#F5A623' },
            { w:'100%',bg:'#22C55E', txt:'Strong',    col:'#22C55E' }
        ];
        if (!val) { fill.style.width='0'; lbl.innerText=''; return; }
        var l = levels[Math.min(score-1, 3)] || levels[0];
        fill.style.width = l.w;
        fill.style.background = l.bg;
        lbl.innerText = l.txt;
        lbl.style.color = l.col;
    }

    // ── Toggle password visibility ──
    function togglePwd(id) {
        var el = document.getElementById(id);
        el.type = el.type === 'password' ? 'text' : 'password';
    }

    // ── Show error ──
    function showErr(msg) {
        var el = document.getElementById('errMsg');
        el.innerText = msg;
        el.classList.add('show');
    }
</script>

</body>
</html>
