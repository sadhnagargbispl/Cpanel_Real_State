
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:#FDF8F0}

:root{
  --navy:#0B1638;--ocean:#1756A9;--gold:#E8A020;
  --cream:#FDF8F0;--mist:#F1F5FB;--slate:#64748B;--border:#E2EAF5;
}

.phone{max-width:390px;margin:0 auto;background:#FDF8F0;min-height:100vh}

/* top header */
.sp-label{display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(232,160,32,.08);border:1px solid rgba(232,160,32,.2);padding:4px 12px;border-radius:100px;margin-bottom:8px}
.sp-title{font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--navy);line-height:1.2}
.sp-sub{font-size:13px;color:var(--slate);margin-top:4px}
.header-block{padding:16px 16px 14px;background:#fff;border-bottom:1px solid var(--border)}

/* search row */
.search-row{display:flex;gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border)}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--mist);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px}
.search-box input{flex:1;border:none;background:transparent;font-size:13px;color:var(--navy);outline:none;font-family:var(--font-sans)}
.search-box input::placeholder{color:#aab4c8}
.search-ico{width:14px;height:14px;stroke:var(--slate);fill:none;stroke-width:2;stroke-linecap:round;flex-shrink:0}

/* FILTER BUTTON */
.filter-toggle-btn{
  display:flex;align-items:center;gap:7px;
  padding:9px 16px;
  background:var(--navy);color:#fff;
  border:none;border-radius:10px;
  font-size:13px;font-weight:600;
  cursor:pointer;font-family:var(--font-sans);
  white-space:nowrap;flex-shrink:0;
  transition:background .2s;
  position:relative;
}
.filter-toggle-btn.active{background:var(--ocean)}
.filter-toggle-btn svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.ftb-badge{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;border:2px solid #fff}
.ftb-badge.show{display:flex}

/* FILTER PANEL — inline expand */
.filter-panel{
  background:#fff;border-bottom:1.5px solid var(--border);
  overflow:hidden;max-height:0;
  transition:max-height .38s cubic-bezier(.4,0,.2,1), padding .3s;
  padding:0 16px;
}
.filter-panel.open{max-height:600px;padding:16px 16px}

.fp-section{margin-bottom:16px}
.fp-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--slate);margin-bottom:8px}
.pill-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fpill{
  padding:9px 12px;border:1.5px solid var(--border);border-radius:99px;
  font-size:12.5px;color:var(--slate);background:var(--mist);
  cursor:pointer;text-align:center;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
  user-select:none;
}
.fpill:active{transform:scale(.97)}
.fpill.on{background:rgba(23,86,169,.1);border-color:var(--ocean);color:var(--ocean);font-weight:600}

.budget-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.budget-lbl{font-size:12px;color:var(--slate)}
.budget-val{font-size:12px;font-weight:700;color:var(--ocean);background:rgba(23,86,169,.08);padding:3px 10px;border-radius:6px}
input[type=range]{width:100%;accent-color:var(--ocean)}

.fp-actions{display:flex;gap:8px;margin-top:4px}
.fp-clear{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:9px;background:transparent;color:var(--slate);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-sans)}
.fp-apply{flex:2;padding:10px;border:none;border-radius:9px;background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-sans);transition:background .2s}
.fp-apply:hover{background:var(--ocean)}

/* results */
.results-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.res-count{font-size:13px;color:var(--slate)}
.res-count strong{color:var(--navy)}

/* cards */
.cards{padding:0 16px 24px;display:flex;flex-direction:column;gap:10px}
.prop-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(11,22,56,.06)}
.prop-img-ph{height:80px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
.ph-plot{background:linear-gradient(145deg,#0B2A1A,#1C7A40)}
.ph-house{background:linear-gradient(145deg,#1A0B2A,#6B2FA0)}
.ph-colony{background:linear-gradient(145deg,#0B1638,#1756A9)}
.prop-badge{position:absolute;top:8px;left:10px;padding:3px 9px;border-radius:100px;font-size:10px;font-weight:700}
.badge-hot{background:#EF4444;color:#fff}
.badge-new{background:#22C55E;color:#fff}
.badge-up{background:var(--gold);color:#fff}
.prop-body{padding:12px 14px}
.prop-type{font-size:10px;font-weight:700;color:var(--ocean);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.prop-name{font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--navy);margin-bottom:2px}
.prop-loc{font-size:11px;color:var(--slate)}
.prop-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid var(--border);background:var(--mist)}
.prop-price{font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--navy)}
.btn-prop{padding:7px 14px;background:var(--navy);color:#fff;border-radius:7px;font-size:12px;font-weight:600;border:none;cursor:pointer}
</style>

<div class="phone">

  <div class="header-block">
    <div class="sp-label">Property Search</div>
    <div class="sp-title">Explore Premium Properties</div>
    <div class="sp-sub">Discover your ideal home across India</div>
  </div>

  <div class="search-row">
    <div class="search-box">
      <svg class="search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/></svg>
      <input placeholder="Search city, area…" id="locIn" oninput="filterNow()" />
    </div>
    <button class="filter-toggle-btn" id="filterBtn" onclick="togglePanel()">
      <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      Filters
      <span class="ftb-badge" id="ftbBadge">0</span>
    </button>
  </div>

  <!-- INLINE EXPAND FILTER PANEL -->
  <div class="filter-panel" id="filterPanel">

    <div class="fp-section">
      <div class="fp-label">Property Type</div>
      <div class="pill-grid">
        <div class="fpill" data-type="Plot" onclick="togglePill(this,'type')">🌿 Plot</div>
        <div class="fpill" data-type="House" onclick="togglePill(this,'type')">🏠 House</div>
        <div class="fpill" data-type="Colony" onclick="togglePill(this,'type')">🏘️ Colony</div>
        <div class="fpill" data-type="Township" onclick="togglePill(this,'type')">🏙️ Township</div>
        <div class="fpill" data-type="Commercial" onclick="togglePill(this,'type')">🏢 Commercial</div>
        <div class="fpill" data-type="Farm" onclick="togglePill(this,'type')">🌾 Farm</div>
      </div>
    </div>

    <div class="fp-section">
      <div class="fp-label">Status</div>
      <div class="pill-grid">
        <div class="fpill" data-status="Active" onclick="togglePill(this,'status')">✅ Active</div>
        <div class="fpill" data-status="Upcoming" onclick="togglePill(this,'status')">🔜 Upcoming</div>
        <div class="fpill" data-status="Sold out" onclick="togglePill(this,'status')">🔴 Sold out</div>
      </div>
    </div>

    <div class="fp-section">
      <div class="fp-label">Budget</div>
      <div class="budget-row">
        <span class="budget-lbl">Range</span>
        <span class="budget-val" id="budgetTxt">Any Budget</span>
      </div>
      <input type="range" min="0" max="4" step="1" value="0" id="budgetSlider"
        oninput="setBudget(this.value)" />
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--slate);margin-top:4px">
        <span>Any</span><span>₹3 Cr+</span>
      </div>
    </div>

    <div class="fp-actions">
      <button class="fp-clear" onclick="clearAll()">✕ Clear</button>
      <button class="fp-apply" onclick="applyAndClose()">🔍 Apply Filters</button>
    </div>

  </div>

  <div class="results-bar">
    <div class="res-count">Showing <strong id="resCnt">5</strong> properties</div>
  </div>

  <div class="cards" id="cardList"></div>

</div>

<script>
var BL=['Any Budget','Under ₹50 Lac','₹50L – 1 Cr','₹1 – 3 Cr','₹3 Cr+'];
var DATA=[
  {name:'Green Valley Estate',city:'Jaipur',type:'Plot',status:'Active',budget:1,price:'₹45 Lac',badge:'badge-new',badgeTxt:'New',img:'ph-plot',emoji:'🌿'},
  {name:'Royal Residency',city:'Delhi',type:'House',status:'Upcoming',budget:3,price:'₹1.8 Cr',badge:'badge-up',badgeTxt:'Upcoming',img:'ph-house',emoji:'🏠'},
  {name:'Sunrise Colony',city:'Jaipur',type:'Colony',status:'Active',budget:2,price:'₹85 Lac',badge:'badge-hot',badgeTxt:'Hot',img:'ph-colony',emoji:'🏘️'},
  {name:'Central Heights',city:'Mumbai',type:'Commercial',status:'Active',budget:4,price:'₹3.2 Cr',badge:'badge-new',badgeTxt:'New',img:'ph-colony',emoji:'🏢'},
  {name:'Palm Township',city:'Pune',type:'Township',status:'Upcoming',budget:3,price:'₹1.4 Cr',badge:'badge-up',badgeTxt:'Upcoming',img:'ph-house',emoji:'🏙️'},
];

var selTypes={}, selStatus={}, budgetV=0, panelOpen=false;
var applied={types:{},statuses:{},budget:0,loc:''};

function togglePanel(){
  panelOpen=!panelOpen;
  document.getElementById('filterPanel').classList.toggle('open',panelOpen);
  document.getElementById('filterBtn').classList.toggle('active',panelOpen);
}

function togglePill(el,kind){
  var key=el.getAttribute('data-'+kind)||el.getAttribute('data-type')||el.getAttribute('data-status');
  var obj=kind==='type'?selTypes:selStatus;
  if(obj[key]){delete obj[key];el.classList.remove('on');}
  else{obj[key]=1;el.classList.add('on');}
}

function setBudget(v){
  budgetV=parseInt(v);
  document.getElementById('budgetTxt').textContent=BL[budgetV];
}

function applyAndClose(){
  applied.types=Object.assign({},selTypes);
  applied.statuses=Object.assign({},selStatus);
  applied.budget=budgetV;
  applied.loc=document.getElementById('locIn').value.trim().toLowerCase();
  panelOpen=false;
  document.getElementById('filterPanel').classList.remove('open');
  document.getElementById('filterBtn').classList.remove('active');
  renderCards();
  updateBadge();
}

function filterNow(){
  applied.loc=document.getElementById('locIn').value.trim().toLowerCase();
  renderCards();
  updateBadge();
}

function clearAll(){
  selTypes={};selStatus={};budgetV=0;
  document.getElementById('budgetSlider').value=0;
  document.getElementById('budgetTxt').textContent='Any Budget';
  document.querySelectorAll('.fpill.on').forEach(function(p){p.classList.remove('on');});
  applied={types:{},statuses:{},budget:0,loc:''};
  document.getElementById('locIn').value='';
  renderCards();updateBadge();
}

function matches(p){
  if(applied.loc&&p.city.toLowerCase().indexOf(applied.loc)<0&&p.name.toLowerCase().indexOf(applied.loc)<0)return false;
  if(Object.keys(applied.types).length&&!applied.types[p.type])return false;
  if(Object.keys(applied.statuses).length&&!applied.statuses[p.status])return false;
  if(applied.budget>0&&p.budget<applied.budget)return false;
  return true;
}

function renderCards(){
  var list=DATA.filter(matches);
  document.getElementById('resCnt').textContent=list.length;
  var el=document.getElementById('cardList');
  el.innerHTML='';
  if(!list.length){el.innerHTML='<div style="text-align:center;padding:32px 16px;color:var(--slate);font-size:14px">🔍 No properties found.<br>Try different filters.</div>';return;}
  list.forEach(function(p){
    var d=document.createElement('div');
    d.className='prop-card';
    d.innerHTML='<div class="prop-img-ph '+p.img+'" style="font-size:28px"><span>'+p.emoji+'</span><span class="prop-badge '+p.badge+'">'+p.badgeTxt+'</span></div><div class="prop-body"><div class="prop-type">'+p.type+'</div><div class="prop-name">'+p.name+'</div><div class="prop-loc">📍 '+p.city+'</div></div><div class="prop-footer"><div class="prop-price">'+p.price+'</div><button class="btn-prop">View Details</button></div>';
    el.appendChild(d);
  });
}

function updateBadge(){
  var n=Object.keys(applied.types).length+Object.keys(applied.statuses).length+(applied.budget>0?1:0)+(applied.loc?1:0);
  var b=document.getElementById('ftbBadge');
  b.textContent=n;
  b.classList.toggle('show',n>0);
}

renderCards();
</script>
